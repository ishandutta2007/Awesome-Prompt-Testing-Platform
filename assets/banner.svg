<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    .pulse-bg { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .floating-card { animation: float 4s infinite ease-in-out; }
    .tech-grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="320" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Ambient Lights -->
  <circle cx="200" cy="80" r="180" fill="url(#cyan-glow)" class="pulse-bg" />
  <circle cx="1000" cy="240" r="200" fill="url(#purple-glow)" opacity="0.15" class="pulse-bg" />

  <!-- Grid Pattern Overlay -->
  <g class="tech-grid">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- Decorative Circuit Nodes & Connectors -->
  <path d="M 100 160 L 250 160 L 300 210 L 450 210" stroke="#334155" stroke-width="2" fill="none" />
  <circle cx="100" cy="160" r="4" fill="#06b6d4" />
  <circle cx="250" cy="160" r="4" fill="#3b82f6" />
  <circle cx="300" cy="210" r="4" fill="#a855f7" />

  <path d="M 750 110 L 900 110 L 950 160 L 1100 160" stroke="#334155" stroke-width="2" fill="none" />
  <circle cx="750" cy="110" r="4" fill="#ec4899" />
  <circle cx="950" cy="160" r="4" fill="#8b5cf6" />
  <circle cx="1100" cy="160" r="4" fill="#06b6d4" />

  <!-- Center Content Area -->
  <g text-anchor="middle">
    <!-- Subtitle Badge -->
    <rect x="440" y="42" width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="600" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
      🧪 LLM EVALUATION &amp; RED-TEAMING
    </text>

    <!-- Main Title -->
    <text x="600" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#text-grad)" filter="url(#glow)" letter-spacing="-0.5">
      Awesome Prompt Testing Platform
    </text>

    <!-- Subtext Description -->
    <text x="600" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Ecosystem of SaaS Platforms &amp; Open-Source Tools for Prompt &amp; Agent Testing
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(310, 215)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="80" y="23" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">🎯 Automated Evals</text>

      <!-- Tag 2 -->
      <rect x="180" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="260" y="23" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">🛡️ AI Red Teaming</text>

      <!-- Tag 3 -->
      <rect x="360" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="440" y="23" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">📊 CI/CD Quality Gates</text>
    </g>
  </g>
</svg>
